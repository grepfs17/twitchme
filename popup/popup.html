<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>TwitchMe</h1>
      <button id="settingsBtn" class="icon-btn" title="Settings">&#9881;</button>
    </header>

    <div class="add-channel">
      <input type="text" id="channelInput" placeholder="Add a channel..." autofocus>
      <button id="addBtn" class="btn-add">+</button>
    </div>

    <div id="channelList" class="channel-list"></div>

    <div class="empty-state" id="emptyState">
      <p>No channels added yet.</p>
      <p class="sub">Add channels above to track when they go live.</p>
    </div>

    <footer>
      <button id="checkNowBtn">Check Now</button>
      <span id="statusText"></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
